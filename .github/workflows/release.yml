name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate tag
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: pnpm check
      - run: pnpm exec glass-ux-docs check
      - run: pnpm build
      - run: pnpm docs:build
        env:
          DOCS_BASE: /glass-ux-ide/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Package release
        run: |
          mkdir -p .release
          pnpm pack --pack-destination .release
          tar -czf .release/glass-ux-ide-docs.tar.gz -C apps/docs/dist .
          cd .release
          sha256sum *.tgz *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; its assets are kept."
          else
            gh release create "$GITHUB_REF_NAME" .release/*.tgz .release/*.tar.gz .release/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
