    <title>Editor lab</title>
    <style>

      #editor { min-height: 0; }

  <body>
    <header>
      <a href="?doc=sample">Sample</a>
      <a href="?doc=huge">100 GB synthetic</a>

    <main id="editor"></main>
    <footer id="status" aria-live="off"></footer>
    <button id="after" type="button">After the editor</button>
    <script type="module" src="./main.ts"></script>

</html>
